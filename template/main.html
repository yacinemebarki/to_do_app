<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="sign-in" id="sign-in">
            <div class="input" id="input">
                <div class="title" id="title">Sign in</div>
                <input class="input-box" id="email" placeholder="enter email">
                <input type="password" class="input-box" id="password" placeholder="enter password">
                <button class="btn" id="in-btn">sing in</button>
            </div>           
            <div class="new" id="new">
                <div class="change">
                    <div class="message">Create new account</div>
                    <button class="btn" id="change-btn">sing up</button>
                </div>    
            </div>
        </div>
        <div class="sign-up" id="sign-up">
            <div class="input" id="input">
                <div class="title" id="title">Sign up</div>
                <input class="input-box" id="email" placeholder="enter email">
                <input class="input-box" id="user-name" placeholder="enter user name">                
                <input type="password" class="input-box" id="enter-password" placeholder="enter password">
                <input type="password" class="input-box" id="confirm-password" placeholder="repeat password">
                <button class="btn" id="up-btn">sing up</button>
            </div>  
            <div class="old" id="old">
                <div class="change">
                    <div class="message">Welcom Back</div>
                    <button class="btn" id="change-btn">sing in</button>
                </div>    
            </div>
        </div>        
    </div>
    <script src="main.js"></script>
</body>
</html>
